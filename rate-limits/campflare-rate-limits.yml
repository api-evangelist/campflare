created: '2026-05-04'
generated: '2026-09-05'
modified: '2026-09-05'
method: searched
source: https://campflare.com/api
description: >-
  Campflare publishes no rate limits. The developer page describes the data products and
  the invite-only access process but names no quota, no window, no burst ceiling, no
  throttling status code and no rate-limit response headers, and there is no separate
  pricing or limits page (https://campflare.com/pricing 404). Runtime headers cannot be
  observed either: the API is invite-only, and the two unauthenticated endpoints that do
  answer — https://api.campflare.com/ and https://api.campflare.com/v2 — return no
  RateLimit-*, X-RateLimit-* or Retry-After header. This file replaces a 2026-05-04 bulk
  sweep scaffold whose tiers, per-minute limits, monthly quotas and header names were
  invented; Campflare never published any of them.
